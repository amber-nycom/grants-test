<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Site</title>
  <style>
    body { font-family: Monteserrat, sans-serif; margin: 0; color: #222; }

    header { background: #1f3a5f; color: #fff; padding: 10px 24px; }
    header h1 { margin: 0; font-size: 20px; }

    nav { background: #e8edf3; padding: 10px 24px; }
    nav button {
      border: 0; background: none; padding: 8px 14px; margin-right: 6px;
      font-size: 16px; cursor: pointer; border-radius: 4px;
    }
    nav button.active { background: #1f3a5f; color: #fff; }

    main { padding: 24px; }

    /* Pages: one visible at a time. Widths are set per page below. */
    .page { display: none; max-width: 1000px; margin: 0 auto; }
    .page.active { display: block; }
    #grants,
    #rep-finder { max-width: 1600px; }

    iframe {
      display: block;
      width: 100%;
      height: 800px;
      margin: 0 auto;
      border: 1px solid #ccc;
    }

    /* Embedded pages fill the window and scroll inside their own frame */
    #grantsFrame { height: calc(100vh - 160px); min-height: 500px; }
    #portalFrame { height: calc(100vh - 160px); min-height: 500px; }
    #solFrame    { height: calc(100vh - 230px); min-height: 500px; }
    #weeklyFrame { height: calc(100vh - 230px); min-height: 500px; }

    #rep-finder h2 { margin: 0 0 8px; }
    #weekly-update h2 { margin: 0 0 4px; }
    #weekly-update { max-width: 720px; }

    /* SOL: centered document, sidebar flush with the page's right edge */
    #SOL { max-width: none; }
    #SOL.active {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 720px) minmax(0, 1fr);
      gap: 24px;
    }
    #SOL .content { grid-column: 2; }
    #SOL .content h2 { margin: 0 0 4px; }
    #SOL .side {
      grid-column: 3;
      justify-self: end;
      width: 220px;
      align-self: start;
      position: sticky;
      top: 16px;
      display: grid;
      gap: 10px;
      font-size: 14px;
      color: #444;
    }
    #SOL .side h3 { margin: 0; font-size: 14px; }
    #SOL .side .btn {
      display: block;
      padding: 9px 12px;
      background: #1f3a5f;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      text-align: center;
    }
    #SOL .side .btn:hover { background: #2b4d7d; }

    /* Not enough room beside the document: sidebar goes below it */
    @media (max-width: 1250px) {
      #SOL.active { display: block; max-width: 720px; margin: 0 auto; }
      #SOL .side { position: static; width: auto; margin-top: 16px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Test Site for Stuff and Things</h1>
  </header>

  <nav>
    <button class="active" data-page="home">Home</button>
    <button data-page="grants">Grants</button>
    <button data-page="SOL">SOL</button>
    <button data-page="rep-finder">Legislators</button>
    <button data-page="weekly-update">Weekly Update</button>
  </nav>

  <main>

    <section id="home" class="page active">
      <h2>Home</h2>
      <p>Testing ideas site.</p>
    </section>

    <section id="grants" class="page">
      <iframe id="grantsFrame"
           src="grants/"
           title="Grants"
           allow="clipboard-write"></iframe>
    </section>

    <section id="SOL" class="page">
      <div class="content">
        <h2>SOL</h2>
        <p>The document below is embedded from Google Docs.</p>
        <iframe id="solFrame"
                src="https://docs.google.com/document/d/e/2PACX-1vQ490TeRKAYceEYBvQB9I77hmi6xlcK5GbfJ1nMPPA8y5UpP14jMa7xrIB6joY7xg/pub?embedded=true"
                title="SOL document"
                loading="lazy"></iframe>
      </div>

      <aside class="side">
        <h3>Quick links</h3>
        <a class="btn" href="#">Button one</a>
        <a class="btn" href="#">Button two</a>
        <p>Notes or info go here.</p>
      </aside>
    </section>

    <section id="rep-finder" class="page">
      <iframe id="portalFrame"
              src="delegation-portal.html"
              title="NY Municipal Delegation Portal"></iframe>
    </section>

    <section id="weekly-update" class="page">
      <h2>Weekly Update</h2>
      <p>The document below is embedded from Google Docs.</p>
      <!-- Replace PLACEHOLDER_DOC_ID with your published Google Doc's ID
           (File > Share > Publish to web > Embed gives you the full URL). -->
      <iframe id="weeklyFrame"
              src="https://docs.google.com/document/d/e/2PACX-1vR6k1WQNsjeoJgKMMBwRRTUc7kHp9iYC1Ghiz4cGJz-dL3OgtgEP50HJ5vrtksynA/pub?embedded=true"
              title="Weekly Update document"
              loading="lazy"></iframe>
    </section>

  </main>

  <script>
    const buttons = document.querySelectorAll('nav button');
    const pages = document.querySelectorAll('.page');

    // Tab switching
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        pages.forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.page).classList.add('active');
      });
    });
  </script>

</body>
</html>
