<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grants Dashboard (Test)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; color: #222; }
    header { background: #1f3a5f; color: #fff; padding: 16px 24px; }
    nav { background: #e8edf3; padding: 10px 24px; }
    nav button {
      border: 0; background: none; padding: 8px 14px; margin-right: 6px;
      font-size: 16px; cursor: pointer; border-radius: 4px;
    }
    nav button.active { background: #1f3a5f; color: #fff; }
    main { padding: 24px; max-width: 1000px; margin: 0 auto; }
    .page { display: none; }
    .page.active { display: block; }
    iframe { width: 100%; height: 800px; border: 1px solid #ccc; }
  </style>
</head>
<body>

<header>
  <h1>Grants Dashboard (Test Site)</h1>
</header>

<nav>
  <button class="active" data-page="home">Home</button>
  <button data-page="grants">Grants</button>
  <button data-page="other-resources">Other Resources</button>
</nav>

<main>

  <section id="home" class="page active">
    <h2>Home</h2>
    <p>Welcome. This is a placeholder home page.</p>
  </section>

  <section id="grants" class="page">
    <h2>Grants</h2>
    <p>Placeholder for the grants list.</p>
  </section>

  <!-- THE EMBED GOES HERE: inside the Other Resources section, below the heading -->
  <section id="other-resources" class="page">
    <h2>Other Resources</h2>
    <p>The document below is embedded from Google Docs.</p>

    <iframe
      src="https://docs.google.com/document/d/e/2PACX-1vQ490TeRKAYceEYBvQB9I77hmi6xlcK5GbfJ1nMPPA8y5UpP14jMa7xrIB6joY7xg/pub?embedded=true"
      title="Other resources document"
      loading="lazy">
    </iframe>
  </section>
</main>

<script>
  const buttons = document.querySelectorAll('nav button');
  const pages = document.querySelectorAll('.page');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      pages.forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.page).classList.add('active');
    });
  });
</script>

</body>
</html>
